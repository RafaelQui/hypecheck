openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wants
    description: Saved products
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /wants:
    get:
      operationId: getWants
      tags: [wants]
      summary: Get the current user's saved products
      parameters:
        - in: header
          name: x-hypecheck-user-id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved wants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WantItem"
        "502":
          description: Supabase unavailable
    post:
      operationId: saveWant
      tags: [wants]
      summary: Save a product to Wants
      parameters:
        - in: header
          name: x-hypecheck-user-id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WantInput"
      responses:
        "201":
          description: Saved want
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantItem"
        "502":
          description: Supabase unavailable
    delete:
      operationId: removeWant
      tags: [wants]
      summary: Remove a product from Wants
      parameters:
        - in: header
          name: x-hypecheck-user-id
          required: true
          schema:
            type: string
        - in: query
          name: productId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Want removed
        "502":
          description: Supabase unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WantItem:
      type: object
      required: [productId, createdAt]
      properties:
        productId:
          type: string
        createdAt:
          type: string
    WantInput:
      type: object
      required: [productId]
      properties:
        productId:
          type: string

